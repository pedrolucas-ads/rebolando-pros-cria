<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Rebolando pros Cria - Até o Chão 🕺✨</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #080214;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Fredoka", sans-serif;
      touch-action: none;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      background: radial-gradient(circle at 50% 30%, #35085e 0%, #110224 65%, #05000d 100%);
      overflow: hidden;
    }

    /* Top HUD */
    #hud-top {
      position: absolute;
      top: max(10px, env(safe-area-inset-top, 10px));
      left: 12px;
      right: 12px;
      max-width: 440px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 40;
      pointer-events: none;
    }

    .hud-card {
      background: rgba(22, 6, 42, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(236, 72, 153, 0.4);
      border-radius: 14px;
      padding: 6px 14px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.7);
    }

    .hud-label {
      font-size: 10px;
      color: #f472b6;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 800;
    }

    .hud-val {
      font-size: 18px;
      font-weight: 900;
      color: #fdf2f8;
      font-family: monospace;
    }

    /* Sound Button */
    .btn-top {
      pointer-events: auto;
      background: rgba(22, 6, 42, 0.88);
      border: 1px solid rgba(236, 72, 153, 0.4);
      color: #ffffff;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
    }

    .btn-top:active {
      transform: scale(0.92);
      background: rgba(236, 72, 153, 0.25);
    }

    /* Hype Bar (Moral dos Cria) */
    #hype-wrapper {
      position: absolute;
      top: max(68px, calc(env(safe-area-inset-top, 10px) + 58px));
      left: 16px;
      right: 16px;
      max-width: 440px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      z-index: 40;
      pointer-events: none;
    }

    #hype-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #38bdf8;
      text-shadow: 0 0 10px #0284c7;
      text-transform: uppercase;
    }

    #hype-bar-outer {
      width: 100%;
      height: 12px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      overflow: hidden;
      border: 1.5px solid rgba(56, 189, 248, 0.6);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.35);
    }

    #hype-bar-inner {
      width: 30%;
      height: 100%;
      background: linear-gradient(90deg, #ec4899, #a855f7, #38bdf8, #facc15);
      border-radius: 20px;
      transition: width 0.1s ease-out;
      box-shadow: 0 0 12px #ec4899;
    }

    /* Canvas */
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      max-width: 480px;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.95);
      cursor: pointer;
    }

    /* Target Indicator Pulse over the character */
    #tap-target-indicator {
      position: absolute;
      top: 52%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 150px;
      height: 200px;
      border-radius: 40px;
      border: 2px dashed rgba(236, 72, 153, 0.4);
      pointer-events: none;
      z-index: 25;
      animation: pulseTarget 1.6s infinite ease-in-out;
    }

    @keyframes pulseTarget {
      0%, 100% { transform: translate(-50%, -50%) scale(1); border-color: rgba(236, 72, 153, 0.4); }
      50% { transform: translate(-50%, -50%) scale(1.06); border-color: rgba(56, 189, 248, 0.8); }
    }

    /* Big Bottom Tap Button */
    #bottom-control {
      position: absolute;
      bottom: max(16px, env(safe-area-inset-bottom, 16px));
      left: 16px;
      right: 16px;
      max-width: 440px;
      margin: 0 auto;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      pointer-events: none;
    }

    .btn-twerk-big {
      pointer-events: auto !important;
      width: 100%;
      height: 64px;
      border-radius: 50px;
      background: linear-gradient(135deg, #ec4899, #a855f7);
      border: 2px solid #ffffff;
      color: #ffffff;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(236, 72, 153, 0.6), 0 0 20px rgba(168, 85, 247, 0.4);
      cursor: pointer;
      transition: transform 0.06s, box-shadow 0.1s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .btn-twerk-big:active {
      transform: scale(0.95);
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.8);
      background: linear-gradient(135deg, #db2777, #9333ea);
    }

    .tip-text {
      font-size: 12px;
      color: #e9d5ff;
      font-weight: 800;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
      letter-spacing: 0.5px;
      text-align: center;
    }

    /* Floating Toast Feedback */
    #feedback-popup {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 28px;
      font-weight: 900;
      font-style: italic;
      text-shadow: 0 0 25px currentColor, 0 4px 12px rgba(0,0,0,0.9);
      pointer-events: none;
      z-index: 45;
      opacity: 0;
      transition: opacity 0.12s, transform 0.12s;
      text-align: center;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <!-- Top HUD -->
    <div id="hud-top">
      <div class="hud-card" style="width: 130px;">
        <span class="hud-label">Pontuação</span>
        <span id="hud-score" class="hud-val">00000</span>
      </div>

      <div class="hud-card" style="align-items: center; width: 130px;">
        <span class="hud-label">Foi no Chão</span>
        <span id="hud-chao" class="hud-val" style="color: #facc15;">0x 🍑</span>
      </div>

      <button id="btn-sound" class="btn-top" title="Som">🔊</button>
    </div>

    <!-- Barra de Moral com os Cria -->
    <div id="hype-wrapper">
      <div id="hype-header">
        <span id="hype-text">MORAL COM OS CRIA: 30%</span>
        <span id="hype-status" style="color: #facc15;">REBOLA LENTINHO!</span>
      </div>
      <div id="hype-bar-outer">
        <div id="hype-bar-inner"></div>
      </div>
    </div>

    <!-- Canvas da Roda de Funk -->
    <canvas id="canvas"></canvas>

    <!-- Indicador Pulsante sobre o Boneco -->
    <div id="tap-target-indicator"></div>

    <!-- Pop-up de Feedback Flutuante -->
    <div id="feedback-popup">LENTINHO! 🔥</div>

    <!-- Botão de Ação na Base -->
    <div id="bottom-control">
      <button id="btn-twerk" class="btn-twerk-big">
        <span>🍑</span> CLIQUE NO BONECO OU AQUI! <span>🔥</span>
      </button>
      <div class="tip-text">CLIQUE RÁPIDO PARA ELE REBOLAR E DESCER ATÉ O CHÃO!</div>
    </div>
  </div>

  <script>
    /* ==========================================================================
       REBOLANDO PROS CRIA - NA RODA DOS CRIA & ATÉ O CHÃO
       Dançarino cercado pela roda de cria em 360°, descendo no chão ao clicar
       ========================================================================== */

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    // Resolução lógica virtual (formato vertical perfeito para smartphone)
    const V_W = 400;
    const V_H = 700;

    let scale = 1;
    let offsetX = 0;
    let offsetY = 0;

    let soundEnabled = true;

    // Estatísticas & Persistência
    let score = 0;
    let chaoCount = 0;
    let hype = 30; // 0 a 100%
    let highScore = parseInt(localStorage.getItem('rebolando_chao_hi') || '0', 10);

    // Sistema de Descida até o Chão
    // 0 = Em pé rebolando | 1 = Agachado no chão rebolando lentinho
    let descentLevel = 0.0;
    let targetDescent = 0.0;
    let isAtFloor = false;
    let floorHoldTimer = 0;

    // Efeitos Visuais & Partículas
    let particles = [];
    let floatingTexts = [];
    let screenShake = 0;
    let flashColor = null;
    let flashAlpha = 0;
    let discoHue = 270;
    let wooferPulse = 0;

    /* ==========================================================================
       ÁUDIO PROCEDURAL DE FUNK TAMBORZÃO (WEB AUDIO API)
       Batida automática de fundo + bumbo/buzina estalando a cada clique
       ========================================================================== */
    let audioCtx = null;
    let beatTimer = 0;
    const BEAT_INTERVAL = 0.46; // ~130 BPM do funk carioca

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          audioCtx = new AudioContext();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playKick(heavy = false) {
      if (!soundEnabled || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const now = audioCtx.currentTime;

        osc.type = 'sine';
        osc.frequency.setValueAtTime(heavy ? 170 : 130, now);
        osc.frequency.exponentialRampToValueAtTime(36, now + (heavy ? 0.25 : 0.18));

        gain.gain.setValueAtTime(heavy ? 0.45 : 0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + (heavy ? 0.3 : 0.22));

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.3);

        wooferPulse = heavy ? 1.4 : 0.9;
      } catch (e) {}
    }

    function playSnare() {
      if (!soundEnabled || !audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const bufferSize = audioCtx.sampleRate * 0.1;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(950, now);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start(now);
      } catch (e) {}
    }

    function playAirhorn() {
      if (!soundEnabled || !audioCtx) return;
      const freqs = [370, 370, 370, 440];
      freqs.forEach((f, idx) => {
        setTimeout(() => {
          try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const now = audioCtx.currentTime;
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(f * 1.6, now);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.12);
          } catch (e) {}
        }, idx * 65);
      });
    }

    /* ==========================================================================
       OS CRIAS AO REDOR (CÍRCULO 360° NA RODA DE FUNK)
       Crias atrás, nas laterais e na frente cercando o dançarino
       ========================================================================== */
    const criasCirculo = [
      // Fundo Esquerda (filmando com celular e flash brilhando)
      { x: 90, y: 280, scale: 0.72, color: '#0284c7', capColor: '#ef4444', isFilming: true, jiggle: 0, phrase: "TÁ DESCENDO! 📱" },
      // Fundo Direita (com cordão e braço pro alto)
      { x: 310, y: 280, scale: 0.72, color: '#16a34a', capColor: '#ffffff', isFilming: false, jiggle: 0.5, phrase: "ISSO AÍ! 🔥" },
      // Meia-Distância Esquerda (com camisa do Flamengo e Juliet)
      { x: 60, y: 390, scale: 0.88, color: '#dc2626', capColor: '#0f172a', hasCup: true, jiggle: 1.0, phrase: "NO TALENTO! 💯" },
      // Meia-Distância Direita (com copo Stanley e Juliet)
      { x: 340, y: 390, scale: 0.88, color: '#9333ea', capColor: '#facc15', hasCup: true, jiggle: 1.5, phrase: "REBOLA LENTINHO! 🍑" },
      // Primeiro Plano Esquerda (de costas/perfil cercando a roda)
      { x: 45, y: 530, scale: 1.05, color: '#2563eb', capColor: '#1e293b', isForeground: true, jiggle: 0.3, phrase: "VAI ATÉ O CHÃO! 💸" },
      // Primeiro Plano Direita (de costas/perfil cercando a roda)
      { x: 355, y: 530, scale: 1.05, color: '#059669', capColor: '#ec4899', isForeground: true, jiggle: 0.8, phrase: "OS CRIA PIRAM! 👑" }
    ];

    function drawCria(c, t) {
      const bounce = Math.sin(t * 8 + c.jiggle) * (6 + descentLevel * 6);
      ctx.save();
      ctx.translate(c.x, c.y + bounce);
      ctx.scale(c.scale, c.scale);

      // Sombra
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.beginPath();
      ctx.ellipse(0, 48, 22, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      // Corpo
      ctx.fillStyle = c.color;
      ctx.beginPath();
      ctx.roundRect(-18, -10, 36, 48, 10);
      ctx.fill();

      // Cabeça
      ctx.fillStyle = '#d97706';
      ctx.beginPath();
      ctx.arc(0, -26, 16, 0, Math.PI * 2);
      ctx.fill();

      // Boné de aba reta
      ctx.fillStyle = c.capColor;
      ctx.fillRect(-18, -38, 36, 10);
      ctx.fillRect(-22, -32, 44, 4);

      // Óculos Juliet
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(-12, -26, 24, 5);

      // Celular filmando (com flash aceso pulsando)
      if (c.isFilming) {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(16, -24, 12, 22);
        // Luz do flash ligada
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(22, -20, 3 + Math.random() * 2, 0, Math.PI * 2);
        ctx.fill();

        // Feixe de luz do flash em direção ao dançarino
        ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.beginPath();
        ctx.moveTo(22, -20);
        ctx.lineTo(80, 40);
        ctx.lineTo(60, 90);
        ctx.closePath();
        ctx.fill();
      }

      // Copo Stanley na mão
      if (c.hasCup) {
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(18, 0, 10, 16);
        ctx.fillStyle = '#0284c7';
        ctx.fillRect(18, 2, 10, 4);
      }

      ctx.restore();
    }

    /* ==========================================================================
       O DANÇARINO NO CENTRO DA RODA (REBOLANDO E DESCENDO ATÉ O CHÃO)
       ========================================================================== */
    const dancer = {
      x: V_W / 2,
      baseY: 430, // Posição em pé

      draw(t) {
        // Interpolação suave de descida
        const squatY = descentLevel * 80; // Desce até 80 pixels em direção ao chão
        const cy = this.baseY + squatY;

        // Frequência do rebolado aumenta e fica mais amplo quanto mais ele desce
        const twerkSpeed = 10 + descentLevel * 14;
        const twerkAmp = 14 + descentLevel * 20;
        const hipWave = Math.sin(t * twerkSpeed) * twerkAmp;

        ctx.save();

        // 1. Sombra expansiva no chão da laje
        ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
        ctx.beginPath();
        ctx.ellipse(this.x, this.baseY + 84, 46 + descentLevel * 18, 14 + descentLevel * 4, 0, 0, Math.PI * 2);
        ctx.fill();

        // 2. Pernas (Abrindo e dobrando conforma desce até o chão)
        ctx.strokeStyle = '#d97706';
        ctx.lineWidth = 11;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        const kneeSpread = 26 + descentLevel * 28; // Abre as pernas no passinho
        const hipX = this.x + hipWave;

        // Perna Esquerda
        ctx.beginPath();
        ctx.moveTo(hipX - 16, cy + 8);
        ctx.quadraticCurveTo(this.x - kneeSpread, cy + 42 - descentLevel * 10, this.x - 26 - descentLevel * 14, this.baseY + 80);
        ctx.stroke();

        // Perna Direita
        ctx.beginPath();
        ctx.moveTo(hipX + 16, cy + 8);
        ctx.quadraticCurveTo(this.x + kneeSpread, cy + 42 - descentLevel * 10, this.x + 26 + descentLevel * 14, this.baseY + 80);
        ctx.stroke();

        // Tênis Brancos com detalhes Rosa Neon
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(this.x - 42 - descentLevel * 14, this.baseY + 76, 26, 12);
        ctx.fillRect(this.x + 16 + descentLevel * 14, this.baseY + 76, 26, 12);
        ctx.fillStyle = '#ec4899';
        ctx.fillRect(this.x - 36 - descentLevel * 14, this.baseY + 78, 12, 4);
        ctx.fillRect(this.x + 22 + descentLevel * 14, this.baseY + 78, 12, 4);

        // 3. Bermuda Tactel (Rebolando o quadril)
        ctx.fillStyle = '#ec4899';
        ctx.beginPath();
        ctx.moveTo(hipX - 24, cy - 8);
        ctx.lineTo(hipX + 24, cy - 8);
        ctx.lineTo(hipX + 28 + descentLevel * 6, cy + 22);
        ctx.lineTo(hipX - 28 - descentLevel * 6, cy + 22);
        ctx.closePath();
        ctx.fill();

        // Faixa amarela estilizada na bermuda
        ctx.fillStyle = '#facc15';
        ctx.fillRect(hipX - 26, cy + 14, 52, 4);

        // 4. Tronco / Regata
        ctx.fillStyle = '#1e1b4b'; // Regata escura estilosa
        const torsoTilt = (hipWave * 0.3);
        ctx.save();
        ctx.translate(this.x, cy - 8);
        ctx.rotate(torsoTilt * 0.02);
        ctx.beginPath();
        ctx.roundRect(-20 + hipWave * 0.3, -46, 40, 46, 8);
        ctx.fill();

        // Cordão de Ouro dos Cria
        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.arc(hipWave * 0.3, -40, 14, 0.2, Math.PI - 0.2);
        ctx.stroke();
        // Cifrão
        ctx.fillStyle = '#facc15';
        ctx.fillRect(hipWave * 0.3 - 4, -25, 8, 8);
        ctx.restore();

        // 5. Braços (No joelho quando desce, no chão quando está lá embaixo)
        ctx.strokeStyle = '#d97706';
        ctx.lineWidth = 9;

        if (descentLevel >= 0.8) {
          // No Chão: mãos apoiando no chão no talento
          ctx.beginPath();
          ctx.moveTo(this.x - 18, cy - 40);
          ctx.lineTo(this.x - 48, cy + 30);
          ctx.lineTo(this.x - 52, this.baseY + 76);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(this.x + 18, cy - 40);
          ctx.lineTo(this.x + 48, cy + 30);
          ctx.lineTo(this.x + 52, this.baseY + 76);
          ctx.stroke();
        } else {
          // Descendo: mãos na coxa/joelho no passinho
          ctx.beginPath();
          ctx.moveTo(this.x - 18, cy - 40);
          ctx.lineTo(this.x - 36, cy - 10 + descentLevel * 10);
          ctx.lineTo(this.x - 22, cy + 16 + descentLevel * 8);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(this.x + 18, cy - 40);
          ctx.lineTo(this.x + 36, cy - 10 + descentLevel * 10);
          ctx.lineTo(this.x + 22, cy + 16 + descentLevel * 8);
          ctx.stroke();
        }

        // 6. Cabeça & Óculos Juliet Furta-cor
        const headX = this.x + hipWave * 0.2;
        const headY = cy - 70;

        ctx.fillStyle = '#d97706';
        ctx.beginPath();
        ctx.arc(headX, headY, 17, 0, Math.PI * 2);
        ctx.fill();

        // Cabelo degradê disfarçado
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(headX, headY - 4, 17, Math.PI, Math.PI * 2);
        ctx.fill();
        ctx.fillRect(headX - 17, headY - 8, 34, 6);

        // Óculos Juliet Espelhado Furta-cor
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(headX - 15, headY - 4, 30, 8);
        const gradJ = ctx.createLinearGradient(headX - 14, headY, headX + 14, headY);
        gradJ.addColorStop(0, '#ef4444');
        gradJ.addColorStop(0.5, '#a855f7');
        gradJ.addColorStop(1, '#38bdf8');
        ctx.fillStyle = gradJ;
        ctx.beginPath();
        ctx.roundRect(headX - 13, headY - 3, 12, 6, 2);
        ctx.roundRect(headX + 1, headY - 3, 12, 6, 2);
        ctx.fill();

        // Sorriso confiante
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(headX, headY + 6, 6, 0.2, Math.PI - 0.2);
        ctx.stroke();

        ctx.restore();
      }
    };

    /* ==========================================================================
       CENÁRIO DA LAJE (PAREDÃO DE SOM E REFLEXOS)
       ========================================================================== */
    function drawScenery(t) {
      discoHue = (discoHue + 0.4) % 360;
      ctx.fillStyle = `hsl(${discoHue}, 75%, 6%)`;
      ctx.fillRect(0, 0, V_W, V_H);

      // Holofote central iluminando o boneco
      ctx.save();
      const spotGrad = ctx.createRadialGradient(V_W / 2, 460, 30, V_W / 2, 460, 220);
      spotGrad.addColorStop(0, `hsla(${discoHue}, 100%, 65%, 0.22)`);
      spotGrad.addColorStop(1, 'transparent');
      ctx.fillStyle = spotGrad;
      ctx.beginPath();
      ctx.arc(V_W / 2, 460, 220, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Paredão de Som no Fundo
      const wallY = 90;
      ctx.fillStyle = '#090314';
      ctx.strokeStyle = '#ec4899';
      ctx.lineWidth = 3;
      ctx.strokeRect(V_W / 2 - 110, wallY, 220, 140);
      ctx.fillRect(V_W / 2 - 110, wallY, 220, 140);

      ctx.fillStyle = '#facc15';
      ctx.font = '900 13px "Fredoka", sans-serif';
      ctx.textAlign = 'center';
      ctx.shadowColor = '#facc15';
      ctx.shadowBlur = 10;
      ctx.fillText("🔊 PAREDÃO DOS CRIA 360° 🔊", V_W / 2, wallY + 24);
      ctx.shadowBlur = 0;

      // Woofers vibrando
      const pSize = 1 + wooferPulse * 0.22;
      const woofers = [
        { x: V_W / 2 - 60, y: wallY + 60, r: 22 },
        { x: V_W / 2 + 60, y: wallY + 60, r: 22 },
        { x: V_W / 2 - 60, y: wallY + 110, r: 22 },
        { x: V_W / 2 + 60, y: wallY + 110, r: 22 },
        { x: V_W / 2, y: wallY + 85, r: 28 }
      ];

      woofers.forEach(w => {
        ctx.fillStyle = '#1c0f33';
        ctx.beginPath();
        ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ec4899';
        ctx.beginPath();
        ctx.arc(w.x, w.y, (w.r * 0.65) * pSize, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#090314';
        ctx.beginPath();
        ctx.arc(w.x, w.y, (w.r * 0.3) * pSize, 0, Math.PI * 2);
        ctx.fill();
      });

      // Piso da laje
      ctx.fillStyle = '#180e2b';
      ctx.fillRect(0, 510, V_W, 190);
    }

    /* ==========================================================================
       PARTÍCULAS (DINHEIRO VOANDO, FOGO, CONFETES)
       ========================================================================== */
    function spawnMoney() {
      for (let i = 0; i < 16; i++) {
        particles.push({
          type: 'money',
          x: V_W / 2 + (Math.random() * 80 - 40),
          y: 430 + (Math.random() * 40 - 20),
          vx: (Math.random() * 8 - 4),
          vy: -(Math.random() * 7 + 4),
          rot: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() * 0.2 - 0.1),
          alpha: 1,
          decay: 0.025
        });
      }
    }

    function spawnFlame() {
      for (let i = 0; i < 10; i++) {
        particles.push({
          type: 'fire',
          x: V_W / 2 + (Math.random() * 60 - 30),
          y: 500,
          vx: (Math.random() * 4 - 2),
          vy: -(Math.random() * 6 + 3),
          size: 6 + Math.random() * 8,
          color: Math.random() < 0.6 ? '#f97316' : '#ec4899',
          alpha: 1,
          decay: 0.05
        });
      }
    }

    function addFloatingText(text, color = '#facc15') {
      floatingTexts.push({
        text: text,
        x: V_W / 2 + (Math.random() * 40 - 20),
        y: 350,
        color: color,
        alpha: 1,
        vy: -2.2
      });
    }

    function showFeedback(text, color = '#ec4899') {
      const pop = document.getElementById('feedback-popup');
      pop.textContent = text;
      pop.style.color = color;
      pop.style.opacity = '1';
      pop.style.transform = 'translate(-50%, -50%) scale(1.2)';
      setTimeout(() => {
        pop.style.opacity = '0';
        pop.style.transform = 'translate(-50%, -50%) scale(0.9)';
      }, 300);
    }

    /* ==========================================================================
       MECÂNICA CENTRAL: CLICAR NO BONECO E DESCER ATÉ O CHÃO
       ========================================================================== */
    function onDancerTwerkClick() {
      initAudio();

      // Cada clique faz o dançarino agachar e descer mais um pouco em direção ao chão!
      targetDescent = Math.min(1.0, targetDescent + 0.25);
      score += 150;
      hype = Math.min(100, hype + 6);

      // Toca o bumbo estalado do funk
      playKick(targetDescent >= 0.9);
      if (Math.random() < 0.5) playSnare();

      // Fogo nas laterais
      spawnFlame();

      // Um cria aleatório da roda solta frase de incentivo
      const randomCria = criasCirculo[Math.floor(Math.random() * criasCirculo.length)];
      addFloatingText(randomCria.phrase, '#38bdf8');

      // Se atingiu o chão completamente!
      if (targetDescent >= 0.95 && !isAtFloor) {
        isAtFloor = true;
        floorHoldTimer = 1.0; // Fica no chão por 1 segundo rebolando no piso
        chaoCount++;
        score += 800;
        hype = 100;
        screenShake = 14;

        playAirhorn();
        spawnMoney();
        showFeedback("FOI ATÉ O CHÃO! 🍑🔥", '#facc15');
        addFloatingText("MORAL MÁXIMA COM OS CRIA! 💸", '#facc15');
      } else {
        if (targetDescent < 0.5) {
          showFeedback("TÁ DESCENDO! ✨", '#38bdf8');
        } else {
          showFeedback("LENTINHO NO GRAVE! 🍑", '#ec4899');
        }
      }

      updateHUD();
    }

    function updateHUD() {
      document.getElementById('hud-score').textContent = String(score).padStart(5, '0');
      document.getElementById('hud-chao').textContent = `${chaoCount}x 🍑`;
      document.getElementById('hype-bar-inner').style.width = `${hype}%`;
      document.getElementById('hype-text').textContent = `MORAL COM OS CRIA: ${Math.round(hype)}%`;

      const statusEl = document.getElementById('hype-status');
      if (hype >= 85) statusEl.textContent = "OS CRIA PIRANDO! 👑";
      else if (hype >= 50) statusEl.textContent = "REBOLA LENTINHO! 🔥";
      else statusEl.textContent = "CLICA PRA DESCER! ⬇️";
    }

    /* ==========================================================================
       LOOP PRINCIPAL (UPDATE & RENDER)
       ========================================================================== */
    let lastTime = performance.now();

    function update(now) {
      const dt = Math.min(0.1, (now - lastTime) / 1000);
      lastTime = now;

      // Batida automática de tamborzão de fundo para manter o funk vivo
      beatTimer += dt;
      if (beatTimer >= BEAT_INTERVAL) {
        beatTimer = 0;
        playKick(false);
        setTimeout(playSnare, 230);
      }

      // Reduz woofer
      if (wooferPulse > 0) wooferPulse = Math.max(0, wooferPulse - dt * 3.5);

      // Reduz shake
      if (screenShake > 0) screenShake *= 0.88;

      // Física da descida até o chão
      if (isAtFloor) {
        floorHoldTimer -= dt;
        if (floorHoldTimer <= 0) {
          isAtFloor = false; // Começa a subir de volta suavemente
        }
      } else {
        // Se não estiver clicando, ele sobe suavemente de volta no talento
        targetDescent = Math.max(0.0, targetDescent - dt * 0.35);
      }

      // Interpolação suave de descentLevel
      descentLevel += (targetDescent - descentLevel) * 0.18;

      // Moral dos cria vai baixando lentamente se não dançar
      hype = Math.max(5, hype - dt * 3.5);

      // Partículas
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;
        if (p.type === 'money') {
          p.rot += p.rotSpeed;
          p.vy += 0.15; // Gravidade
        }
        if (p.alpha <= 0) particles.splice(i, 1);
      }

      // Textos flutuantes
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y += ft.vy;
        ft.alpha -= 0.02;
        if (ft.alpha <= 0) floatingTexts.splice(i, 1);
      }

      updateHUD();
    }

    function render(now) {
      const t = now / 1000;
      ctx.save();

      // Screen Shake
      if (screenShake > 0.5) {
        ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
      }

      // 1. Cenário da Laje e Paredão de Som
      drawScenery(t);

      // 2. Os Crias de Fundo da Roda (Atrás do Dançarino)
      criasCirculo.filter(c => !c.isForeground).forEach(c => drawCria(c, t));

      // 3. O Dançarino no Centro da Roda
      dancer.draw(t);

      // 4. Os Crias de Primeiro Plano (Na Frente do Dançarino, cercando a roda)
      criasCirculo.filter(c => c.isForeground).forEach(c => drawCria(c, t));

      // 5. Partículas (Dinheiro voando, chamas)
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        if (p.type === 'money') {
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          // Nota de 100 Reais (Azul / Verde)
          ctx.fillStyle = '#065f46';
          ctx.fillRect(-12, -7, 24, 14);
          ctx.fillStyle = '#34d399';
          ctx.fillRect(-10, -5, 20, 10);
          ctx.fillStyle = '#064e3b';
          ctx.font = 'bold 7px monospace';
          ctx.fillText("100", -7, 3);
        } else if (p.type === 'fire') {
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      });

      // 6. Textos Flutuantes
      floatingTexts.forEach(ft => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, ft.alpha);
        ctx.fillStyle = ft.color;
        ctx.font = '900 14px "Fredoka", sans-serif';
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(0,0,0,0.85)';
        ctx.shadowBlur = 8;
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
      });

      ctx.restore();
    }

    function gameLoop(time) {
      update(time);
      render(time);
      requestAnimationFrame(gameLoop);
    }

    /* ==========================================================================
       RESPONSIVIDADE DO CANVAS
       ========================================================================== */
    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const w = canvas.parentElement.clientWidth;
      const h = canvas.parentElement.clientHeight;

      canvas.width = Math.min(w, 480) * dpr;
      canvas.height = h * dpr;

      const sX = canvas.width / V_W;
      const sY = canvas.height / V_H;
      scale = Math.min(sX, sY);

      offsetX = (canvas.width - V_W * scale) / 2;
      offsetY = (canvas.height - V_H * scale) / 2;

      ctx.resetTransform();
      ctx.translate(offsetX, offsetY);
      ctx.scale(scale, scale);
    }

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 150));
    resizeCanvas();

    /* ==========================================================================
       CONTROLES DE TOQUE: CLIQUE DIRETO NO BONECO OU NO BOTÃO
       ========================================================================== */
    // Clique direto no Canvas (em cima do boneco ou na tela)
    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      onDancerTwerkClick();
    });

    // Botão de ação grande na base
    const btnTwerk = document.getElementById('btn-twerk');
    btnTwerk.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      onDancerTwerkClick();
    });

    // Teclado no PC (Espaço / Seta Baixo)
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowDown' || e.code === 'Enter') {
        e.preventDefault();
        onDancerTwerkClick();
      }
    });

    // Botão de Som
    const btnSound = document.getElementById('btn-sound');
    btnSound.addEventListener('click', (e) => {
      e.stopPropagation();
      initAudio();
      soundEnabled = !soundEnabled;
      btnSound.textContent = soundEnabled ? '🔊' : '🔇';
    });

    // Inicia o Loop do Jogo
    requestAnimationFrame(gameLoop);
  </script>
</body>
